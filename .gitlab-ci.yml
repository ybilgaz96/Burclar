stages:
  - generate

generate_horoscopes:
  stage: generate
  image: node:20-alpine
  script:
    - bash scripts/ci-generate.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  artifacts:
    paths:
      - data/
      - pages/
    expire_in: 1 hour